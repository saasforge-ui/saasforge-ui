name: Component request
description: Suggest a new component or template
labels: ["component request"]
body:
  - type: input
    id: name
    attributes:
      label: Component name
      placeholder: e.g. Date Range Picker
    validations:
      required: true
  - type: dropdown
    id: category
    attributes:
      label: Category
      options:
        - Dashboard
        - Users
        - Billing
        - Analytics
        - Settings
        - Utilities
        - Auth
        - Marketing
        - Ecommerce
        - Communication
        - Data
        - Navigation
        - Forms
        - Notifications
        - AI
        - Developer
        - New category / not sure
    validations:
      required: true
  - type: textarea
    id: use-case
    attributes:
      label: Use case
      description: What would you build with it? What problem does it solve in a SaaS app?
    validations:
      required: true
  - type: textarea
    id: references
    attributes:
      label: References
      description: Links or screenshots of similar components you like.
  - type: checkboxes
    id: contribute
    attributes:
      label: Contribution
      options:
        - label: I'd like to build this myself (see CONTRIBUTING.md)
